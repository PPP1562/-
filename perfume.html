<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ароматы" />
<title>Ароматы на точке</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap');
  html, body { margin:0; padding:0; background:#1A0E12; }
  body { padding: 24px 12px; }
</style>
</head>
<body>
<div id="app" style="max-width:760px;margin:0 auto;font-family:'Cormorant Garamond',Georgia,serif;background:#241318;color:#F2E6DC;border-radius:14px;overflow:hidden;">

  <div style="padding:28px 32px 20px;border-bottom:1px solid #3E2530;">
    <div style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#C9A24B;margin-bottom:6px;">Учёт ассортимента</div>
    <h1 style="margin:0;font-size:26px;font-weight:500;color:#F8EFE4;">Ароматы на точке</h1>
    <div style="font-size:13px;color:#A9899A;margin-top:4px;">Данные хранятся только у тебя.</div>
  </div>

  <div style="padding:20px 32px;border-bottom:1px solid #3E2530;display:grid;grid-template-columns:1fr 1fr;gap:10px;">
    <input id="f-name" placeholder="Название" style="grid-column:1/3;padding:9px 12px;border-radius:8px;border:1px solid #4A2E3B;background:#2E1A22;color:#F2E6DC;font-family:inherit;font-size:15px;box-sizing:border-box;">
    <input id="f-brand" placeholder="Бренд" style="padding:9px 12px;border-radius:8px;border:1px solid #4A2E3B;background:#2E1A22;color:#F2E6DC;font-family:inherit;font-size:15px;box-sizing:border-box;">
    <select id="f-type" style="padding:9px 12px;border-radius:8px;border:1px solid #4A2E3B;background:#2E1A22;color:#F2E6DC;font-family:inherit;font-size:15px;box-sizing:border-box;">
      <option value="">тип (необязательно)</option>
      <option value="оригинал">оригинал</option>
      <option value="разлив">разлив</option>
      <option value="масляные">масляные</option>
    </select>
    <input id="f-cost" type="number" step="0.01" placeholder="Закупка, ₽/мл" style="padding:9px 12px;border-radius:8px;border:1px solid #4A2E3B;background:#2E1A22;color:#F2E6DC;font-family:inherit;font-size:15px;box-sizing:border-box;">
    <input id="f-price" type="number" step="1" placeholder="Розница, ₽" style="padding:9px 12px;border-radius:8px;border:1px solid #4A2E3B;background:#2E1A22;color:#F2E6DC;font-family:inherit;font-size:15px;box-sizing:border-box;">
    <div id="error-msg" style="display:none;grid-column:1/3;color:#D98B6B;font-size:12px;"></div>
    <button id="add-btn" style="grid-column:1/3;margin-top:2px;padding:10px;border-radius:8px;border:none;background:#8A2E3F;color:#F8EFE4;font-family:inherit;font-size:15px;cursor:pointer;">Добавить позицию</button>
  </div>

  <div style="padding:16px 32px 0;">
    <input id="search" placeholder="Поиск по названию / бренду" style="width:100%;padding:7px 12px;border-radius:20px;border:1px solid #4A2E3B;background:#2E1A22;color:#F2E6DC;font-family:inherit;font-size:13px;box-sizing:border-box;">
  </div>

  <div id="summary" style="padding:16px 32px 0;font-size:12px;color:#A9899A;"></div>

  <div style="padding:18px 32px 32px;overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <thead>
        <tr style="border-bottom:1px solid #4A2E3B;">
          <th style="text-align:left;padding:8px 10px 8px 0;color:#C9A24B;font-weight:500;font-size:11px;letter-spacing:1px;text-transform:uppercase;">Название</th>
          <th style="text-align:left;padding:8px 10px;color:#C9A24B;font-weight:500;font-size:11px;letter-spacing:1px;text-transform:uppercase;">Бренд</th>
          <th style="text-align:left;padding:8px 10px;color:#C9A24B;font-weight:500;font-size:11px;letter-spacing:1px;text-transform:uppercase;">Тип</th>
          <th style="text-align:right;padding:8px 10px;color:#C9A24B;font-weight:500;font-size:11px;letter-spacing:1px;text-transform:uppercase;">Закупка</th>
          <th style="text-align:right;padding:8px 10px;color:#C9A24B;font-weight:500;font-size:11px;letter-spacing:1px;text-transform:uppercase;">Розница</th>
          <th style="text-align:right;padding:8px 10px;color:#C9A24B;font-weight:500;font-size:11px;letter-spacing:1px;text-transform:uppercase;">Маржа</th>
          <th style="width:40px;"></th>
        </tr>
      </thead>
      <tbody id="entries"></tbody>
    </table>
  </div>
</div>

<script>
(function() {
  const STORAGE_KEY = 'perfume-inventory-items';
  let items = [];
  let searchQuery = '';

  // Imported from the user's spreadsheet — most rows only had name + brand filled in
  const SEED_ITEMS = [
    { name: "Bombshell", brand: "Victoria's Secret", type: "", cost: 7, price: 900 },
    { name: "Scandalous", brand: "Victoria's Secret", type: "", cost: null, price: null },
    { name: "Imagination", brand: "LV", type: "", cost: null, price: null },
    { name: "Symphony", brand: "LV", type: "", cost: null, price: null },
    { name: "Afternoon swim", brand: "LV", type: "", cost: null, price: null },
    { name: "Limmensite", brand: "LV", type: "", cost: null, price: null },
    { name: "Orage", brand: "LV", type: "", cost: null, price: null },
    { name: "Ombre Nomade", brand: "LV", type: "", cost: null, price: null },
    { name: "Pacific chill", brand: "LV", type: "", cost: null, price: null },
    { name: "Rain Tea", brand: "LV", type: "", cost: null, price: null },
    { name: "Blonde Amber XXI", brand: "Clive Christian", type: "", cost: null, price: null },
    { name: "Out of the blue", brand: "Clive Christian", type: "", cost: null, price: null },
    { name: "Town&Country", brand: "Clive Christian", type: "", cost: null, price: null },
    { name: "Hedonistic", brand: "Clive Christian", type: "", cost: null, price: null },
    { name: "Matsukita", brand: "Clive Christian", type: "", cost: null, price: null },
    { name: "Paragon", brand: "Initio", type: "", cost: null, price: null },
    { name: "Musk Therapy", brand: "Initio", type: "", cost: null, price: null },
    { name: "Oud for Greatness", brand: "Initio", type: "", cost: null, price: null },
    { name: "Side Effect", brand: "Initio", type: "", cost: null, price: null },
    { name: "Tyger", brand: "Bvlgary", type: "", cost: null, price: null },
    { name: "Aqua Marine", brand: "Bvlgary", type: "", cost: null, price: null },
    { name: "Aqua Atlantic", brand: "Bvlgary", type: "", cost: null, price: null },
    { name: "Gemme Empyr", brand: "Bvlgary", type: "", cost: null, price: null },
    { name: "Devils Intrigued", brand: "HFC", type: "", cost: null, price: null },
    { name: "Or Noir", brand: "HFC", type: "", cost: null, price: null },
    { name: "Blue Talisman", brand: "Ex Nihilo", type: "", cost: null, price: null },
    { name: "Hedonistic", brand: "Ex Nihilo", type: "", cost: null, price: null },
    { name: "Fleur Narcotique", brand: "Ex Nihilo", type: "", cost: null, price: null },
    { name: "Libre", brand: "YSL", type: "", cost: null, price: null },
    { name: "Y", brand: "YSL", type: "", cost: null, price: null },
    { name: "Intense", brand: "YSL", type: "", cost: null, price: null },
    { name: "Tobacco Vanille", brand: "Tom Ford", type: "", cost: null, price: null },
    { name: "Ombre Leather", brand: "Tom Ford", type: "", cost: null, price: null },
    { name: "Gaba", brand: "Gormone Paris", type: "", cost: null, price: null },
    { name: "Testesteron", brand: "Gormone Paris", type: "", cost: null, price: null },
  ].map(it => ({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), ...it }));

  const entriesEl = document.getElementById('entries');
  const summaryEl = document.getElementById('summary');
  const errorEl = document.getElementById('error-msg');
  const addBtn = document.getElementById('add-btn');
  const nameEl = document.getElementById('f-name');
  const brandEl = document.getElementById('f-brand');
  const typeEl = document.getElementById('f-type');
  const costEl = document.getElementById('f-cost');
  const priceEl = document.getElementById('f-price');
  const searchEl = document.getElementById('search');

  function fmtRub(n) { return (n === null || n === undefined) ? '—' : Math.round(n).toLocaleString('ru-RU') + '₽/мл'; }

  async function loadItems() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        items = JSON.parse(raw);
      } else {
        items = SEED_ITEMS;
        await saveItems();
      }
    } catch (e) {
      items = SEED_ITEMS;
      await saveItems();
    }
    render();
  }

  async function saveItems() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    } catch (e) {
      errorEl.textContent = 'Не удалось сохранить. Попробуй ещё раз.';
      errorEl.style.display = 'block';
    }
  }

  function render() {
    let filtered = items;
    if (searchQuery.trim()) {
      const q = searchQuery.trim().toLowerCase();
      filtered = filtered.filter(i => i.name.toLowerCase().includes(q) || i.brand.toLowerCase().includes(q));
    }

    const total = items.length;
    const noCost = items.filter(i => i.cost === null || i.cost === undefined).length;
    const noPrice = items.filter(i => i.price === null || i.price === undefined).length;
    summaryEl.textContent = total === 0 ? '' : `всего позиций: ${total}` + (noCost ? ` · без закупки: ${noCost}` : '') + (noPrice ? ` · без розницы: ${noPrice}` : '');

    if (filtered.length === 0) {
      entriesEl.innerHTML = '<tr><td colspan="7" style="color:#7A6070;font-size:13px;padding:20px 0;text-align:center;">Позиций пока нет.</td></tr>';
      return;
    }
    entriesEl.innerHTML = '';
    filtered.slice().reverse().forEach((item, idx) => {
      const row = document.createElement('tr');
      row.style.cssText = 'border-bottom:1px solid #33202A;' + (idx % 2 === 1 ? 'background:#2A1720;' : '');

      const nameTd = document.createElement('td');
      nameTd.textContent = item.name;
      nameTd.style.cssText = 'padding:9px 10px 9px 0;color:#F8EFE4;font-size:16px;';

      const brandTd = document.createElement('td');
      brandTd.textContent = item.brand;
      brandTd.style.cssText = 'padding:9px 10px;color:#D8C4CE;';

      const typeTd = document.createElement('td');
      typeTd.style.cssText = 'padding:6px 10px;';
      const typeSelect = document.createElement('select');
      typeSelect.style.cssText = 'width:100%;background:transparent;border:1px solid transparent;color:' + (item.type ? '#D8C4CE' : '#7A6070') + ';font-family:inherit;font-size:14px;padding:4px 2px;border-radius:4px;cursor:pointer;';
      ['', 'оригинал', 'разлив', 'масляные'].forEach(opt => {
        const o = document.createElement('option');
        o.value = opt;
        o.textContent = opt === '' ? '—' : opt;
        o.style.background = '#2E1A22';
        if (item.type === opt) o.selected = true;
        typeSelect.appendChild(o);
      });
      typeSelect.onmouseenter = () => { typeSelect.style.borderColor = '#4A2E3B'; };
      typeSelect.onmouseleave = () => { if (document.activeElement !== typeSelect) typeSelect.style.borderColor = 'transparent'; };
      typeSelect.onfocus = () => { typeSelect.style.borderColor = '#C9A24B'; };
      typeSelect.onblur = () => { typeSelect.style.borderColor = 'transparent'; };
      typeSelect.onchange = async () => {
        item.type = typeSelect.value;
        typeSelect.style.color = item.type ? '#D8C4CE' : '#7A6070';
        await saveItems();
      };
      typeTd.appendChild(typeSelect);

      const costTd = document.createElement('td');
      costTd.style.cssText = 'padding:6px 10px;text-align:right;';
      const costInput = document.createElement('input');
      costInput.type = 'number';
      costInput.step = '0.01';
      costInput.placeholder = '—';
      costInput.value = (item.cost === null || item.cost === undefined) ? '' : item.cost;
      costInput.style.cssText = 'width:90px;text-align:right;background:transparent;border:1px solid transparent;color:#C9A24B;font-family:inherit;font-size:14px;padding:4px 6px;border-radius:4px;';
      costInput.onmouseenter = () => { costInput.style.borderColor = '#4A2E3B'; };
      costInput.onmouseleave = () => { if (document.activeElement !== costInput) costInput.style.borderColor = 'transparent'; };
      costInput.onfocus = () => { costInput.style.borderColor = '#C9A24B'; };
      costInput.onblur = async () => {
        costInput.style.borderColor = 'transparent';
        const v = costInput.value.trim();
        const c = v === '' ? null : parseFloat(v);
        item.cost = (c !== null && isNaN(c)) ? null : c;
        await saveItems();
      };
      costInput.onkeydown = (e) => { if (e.key === 'Enter') costInput.blur(); };
      costTd.appendChild(costInput);
      const unitSpan = document.createElement('span');
      unitSpan.textContent = ' ₽/мл';
      unitSpan.style.cssText = 'color:#7A6070;font-size:12px;';
      costTd.appendChild(unitSpan);

      const priceTd = document.createElement('td');
      priceTd.style.cssText = 'padding:6px 10px;text-align:right;';
      const priceInput = document.createElement('input');
      priceInput.type = 'number';
      priceInput.step = '1';
      priceInput.placeholder = '—';
      priceInput.value = (item.price === null || item.price === undefined) ? '' : item.price;
      priceInput.style.cssText = 'width:80px;text-align:right;background:transparent;border:1px solid transparent;color:#8FAE7E;font-family:inherit;font-size:14px;padding:4px 6px;border-radius:4px;';
      priceInput.onmouseenter = () => { priceInput.style.borderColor = '#4A2E3B'; };
      priceInput.onmouseleave = () => { if (document.activeElement !== priceInput) priceInput.style.borderColor = 'transparent'; };
      priceInput.onfocus = () => { priceInput.style.borderColor = '#8FAE7E'; };
      priceInput.onblur = async () => {
        priceInput.style.borderColor = 'transparent';
        const v = priceInput.value.trim();
        const p = v === '' ? null : parseFloat(v);
        item.price = (p !== null && isNaN(p)) ? null : p;
        marginTd.textContent = marginText(item);
        marginTd.style.color = marginColor(item);
        await saveItems();
      };
      priceInput.onkeydown = (e) => { if (e.key === 'Enter') priceInput.blur(); };
      priceTd.appendChild(priceInput);
      const rubSpan = document.createElement('span');
      rubSpan.textContent = ' ₽';
      rubSpan.style.cssText = 'color:#7A6070;font-size:12px;';
      priceTd.appendChild(rubSpan);

      function marginText(it) {
        if (it.cost === null || it.cost === undefined || it.price === null || it.price === undefined || it.price <= 0) return '—';
        return Math.round((it.price - it.cost) / it.price * 100) + '%';
      }
      function marginColor(it) {
        if (it.cost === null || it.cost === undefined || it.price === null || it.price === undefined || it.price <= 0) return '#7A6070';
        const m = (it.price - it.cost) / it.price * 100;
        return m < 30 ? '#D98B6B' : '#C9A24B';
      }
      const marginTd = document.createElement('td');
      marginTd.textContent = marginText(item);
      marginTd.style.cssText = 'padding:9px 10px;text-align:right;font-size:13px;color:' + marginColor(item) + ';';
      // also update margin live while typing cost (before blur commits)
      costInput.oninput = () => {
        const v = costInput.value.trim();
        const c = v === '' ? null : parseFloat(v);
        item.cost = (c !== null && isNaN(c)) ? null : c;
        marginTd.textContent = marginText(item);
        marginTd.style.color = marginColor(item);
      };
      priceInput.oninput = () => {
        const v = priceInput.value.trim();
        const p = v === '' ? null : parseFloat(v);
        item.price = (p !== null && isNaN(p)) ? null : p;
        marginTd.textContent = marginText(item);
        marginTd.style.color = marginColor(item);
      };

      const actionsTd = document.createElement('td');
      actionsTd.style.cssText = 'padding:9px 0 9px 10px;text-align:right;white-space:nowrap;';

      const delBtn = document.createElement('button');
      delBtn.textContent = '✕';
      delBtn.title = 'Удалить';
      delBtn.style.cssText = 'background:none;border:none;color:#A66A5A;font-family:inherit;font-size:14px;cursor:pointer;padding:0 4px;';
      delBtn.onclick = async () => {
        items = items.filter(i => i.id !== item.id);
        await saveItems();
        render();
      };

      actionsTd.appendChild(delBtn);

      row.appendChild(nameTd);
      row.appendChild(brandTd);
      row.appendChild(typeTd);
      row.appendChild(costTd);
      row.appendChild(priceTd);
      row.appendChild(marginTd);
      row.appendChild(actionsTd);
      entriesEl.appendChild(row);
    });
  }

  searchEl.addEventListener('input', () => {
    searchQuery = searchEl.value;
    render();
  });

  addBtn.addEventListener('click', async () => {
    const name = nameEl.value.trim();
    const brand = brandEl.value.trim();
    const type = typeEl.value;
    const costRaw = costEl.value.trim();
    const cost = costRaw === '' ? null : parseFloat(costRaw);
    const priceRaw = priceEl.value.trim();
    const price = priceRaw === '' ? null : parseFloat(priceRaw);

    if (!name || !brand) {
      errorEl.textContent = 'Заполни хотя бы название и бренд.';
      errorEl.style.display = 'block';
      return;
    }
    errorEl.style.display = 'none';

    items.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      name, brand, type,
      cost: (cost !== null && isNaN(cost)) ? null : cost,
      price: (price !== null && isNaN(price)) ? null : price
    });

    nameEl.value = ''; brandEl.value = ''; typeEl.value = ''; costEl.value = ''; priceEl.value = '';
    addBtn.disabled = true;
    addBtn.textContent = 'Сохраняю...';
    await saveItems();
    addBtn.disabled = false;
    addBtn.textContent = 'Добавить позицию';
    render();
  });

  loadItems();
})();
</script>

</body>
</html>
